[project]
name = "lullaby-companion"
version = "0.1.0"
description = "Reachy Mini surgery companion: scripted stories, breathing games, and a quiet recovery mode."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "requests>=2.32",
    "reachy-mini==1.12.0",
    "elevenlabs>=2.78.0",
    "python-dotenv>=1.2.4",
    "faster-whisper>=1.2.1",
]

[project.scripts]
lullaby = "lullaby.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lullaby"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
