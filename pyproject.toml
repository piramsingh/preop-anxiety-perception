[project]
name = "preop-anxiety-perception"
version = "0.1.0"
description = "Local, software-only estimation of pre-operative distress from observable behavior (mYPAS domains)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=1.2,<2",
    "numpy>=1.26",
    "opencv-contrib-python>=4.8",
    "opensmile>=2.6,<3",
    "pyyaml>=6",
    "sounddevice>=0.5,<1",
]

[project.scripts]
preop = "preop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the downloaded pose model (skipped when it is absent)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
